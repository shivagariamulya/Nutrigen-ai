spring.application.name=nutrigen
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/nutrigen?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:nutrigen}
spring.datasource.password=${DB_PASSWORD:nutrigen}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
